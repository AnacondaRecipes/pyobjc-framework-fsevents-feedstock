{% set name = "pyobjc-framework-FSEvents" %}
{% set version = "12.2.1" %}
{% set pypi_name = name|replace("-", "_")|lower %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pyobjc-framework-FSEvents/pyobjc_framework_fsevents-12.2.1.tar.gz
  sha256: f78c98f68bc643794668a9484fc348ef3e98df359db7d8726cada35310af93b4

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [not osx or py<310]

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - pyobjc-core >={{ version }}
    - pyobjc-framework-cocoa >={{ version }}
  run_constrained:
    - __osx >=10.5

test:
  imports:
    - FSEvents
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  home: https://github.com/ronaldoussoren/pyobjc
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Wrappers for the framework FSEvents on macOS
  description: |
    Wrappers for the framework FSEvents on macOS
  dev_url: https://github.com/ronaldoussoren/pyobjc/tree/master/pyobjc-framework-FSEvents
  doc_url: https://github.com/ronaldoussoren/pyobjc

extra:
  recipe-maintainers:
    - xhochy
